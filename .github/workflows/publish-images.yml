name: Build and Push monad-node and monad-rpc Images

on:
  push:
    branches:
      - feature/add-sys-calls-fh

env:
  REGISTRY: ghcr.io
  ORG_NAME: streamingfast

jobs:
  build-and-push:
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short commit hash
        run: echo "GIT_SHORT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build and push monad-node image
        run: |
          docker build \
            --build-arg GIT_TAG_VERSION=${{ env.GIT_SHORT_HASH }} \
            -t ${{ env.REGISTRY }}/${{ env.ORG_NAME }}/monad-node:${{ env.GIT_SHORT_HASH }} \
            -f docker/devnet/Dockerfile \
            --target runner \
            .
          docker push ${{ env.REGISTRY }}/${{ env.ORG_NAME }}/monad-node:${{ env.GIT_SHORT_HASH }}

      - name: Build and push monad-rpc image
        run: |
          docker build \
            --build-arg GIT_TAG_VERSION=${{ env.GIT_SHORT_HASH }} \
            -t ${{ env.REGISTRY }}/${{ env.ORG_NAME }}/monad-rpc:${{ env.GIT_SHORT_HASH }} \
            -f docker/rpc/Dockerfile \
            --target runner \
            .
          docker push ${{ env.REGISTRY }}/${{ env.ORG_NAME }}/monad-rpc:${{ env.GIT_SHORT_HASH }}

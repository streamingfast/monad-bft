name: Build and Push monad-node and monad-rpc Images

on:
  push:
    branches:
      - release/**
    tags:
      - v*-fh*
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  ORG_NAME: streamingfast

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: monad-node
            dockerfile: docker/devnet/Dockerfile
          - image: monad-rpc
            dockerfile: docker/rpc/Dockerfile

    permissions:
      contents: read
      packages: write

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # On a tag build, the version baked into the binary is the tag itself, otherwise
      # we fall back to the short commit hash like we have always done on branch builds.
      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate docker tags/labels from github build context
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG_NAME }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push ${{ matrix.image }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          target: runner
          build-args: |
            GIT_TAG_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  release:
    name: GitHub Release
    runs-on: ubuntu-24.04
    needs: build
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write

    steps:
      # Fails when CHANGELOG.sf.md has no section for the tag being released, which is
      # exactly what we want: a release must be described before it goes out.
      - name: Extract changelog section
        id: changelog
        run: |
          curl -sSL https://github.com/streamingfast/sfreleaser/releases/download/v0.15.0/sfreleaser_linux_x86_64.tar.gz | tar -xz
          chmod +x sfreleaser

          ./sfreleaser changelog extract-section \
            github://token:${{ github.token }}@${{ github.repository }}/${{ github.sha }}/CHANGELOG.sf.md \
            "${{ github.ref_name }}" \
            --github-output="changelog:$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') }}
          body: |
            ${{ steps.changelog.outputs.changelog }}

            ### Docker Images

            - `${{ env.REGISTRY }}/${{ env.ORG_NAME }}/monad-node:${{ github.ref_name }}`
            - `${{ env.REGISTRY }}/${{ env.ORG_NAME }}/monad-rpc:${{ github.ref_name }}`

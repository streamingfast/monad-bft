name: Build and Push monad-node and monad-rpc Images

on:
  push:
    branches:
      - feature/add-sys-calls-fh

env:
  REGISTRY: ghcr.io
  ORG_NAME: streamingfast

jobs:
  build-and-push-node:
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for monad-node
        id: meta-node
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG_NAME }}/monad-node
          tags: |
            type=ref,event=branch
            type=sha,prefix=
          flavor: |
            latest=false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get short commit hash
        run: echo "GIT_SHORT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build and push monad-node image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/devnet/Dockerfile
          push: true
          tags: ${{ steps.meta-node.outputs.tags }}
          labels: ${{ steps.meta-node.outputs.labels }}
          target: runner
          build-args: |
            GIT_TAG_VERSION=${{ env.GIT_SHORT_HASH }}
          cache-from: type=gha,scope=monad-node
          cache-to: type=gha,scope=monad-node,mode=max

  build-and-push-rpc:
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for monad-rpc
        id: meta-rpc
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG_NAME }}/monad-rpc
          tags: |
            type=ref,event=branch
            type=sha,prefix=
          flavor: |
            latest=false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get short commit hash
        run: echo "GIT_SHORT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build and push monad-rpc image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/rpc/Dockerfile
          push: true
          tags: ${{ steps.meta-rpc.outputs.tags }}
          labels: ${{ steps.meta-rpc.outputs.labels }}
          target: runner
          build-args: |
            GIT_TAG_VERSION=${{ env.GIT_SHORT_HASH }}
          cache-from: type=gha,scope=monad-rpc
          cache-to: type=gha,scope=monad-rpc,mode=max
